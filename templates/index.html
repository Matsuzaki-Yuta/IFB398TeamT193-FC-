<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Video Matcher</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #333; }
    .upload-box { background: white; border: 2px dashed #aaa; border-radius: 8px; padding: 30px; text-align: center; }
    input[type="file"] { margin: 10px 0; }
    button { background: #0066cc; color: white; border: none; padding: 10px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #status { margin: 20px 0; color: #555; font-style: italic; }
    #analysis { background: white; border-radius: 8px; padding: 20px; margin: 20px 0; display: none; }
    #analysis h2 { margin-top: 0; }
    #analysis pre { background: #f0f0f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
    .package-card { background: white; border-radius: 8px; padding: 20px; margin: 16px 0; border-left: 4px solid #0066cc; }
    .package-card h3 { margin-top: 0; color: #0066cc; }
    .package-card .price { font-size: 20px; font-weight: bold; color: #e60000; }
    .package-card .meta { color: #666; font-size: 14px; margin: 6px 0; }
    .package-card .reasons { background: #eef6ff; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-top: 10px; }
    .package-card a { color: #0066cc; }
    .tag { display: inline-block; background: #e0f0ff; color: #0066cc; border-radius: 12px; padding: 2px 10px; font-size: 12px; margin: 2px; }
    #no-match { color: #888; font-style: italic; display: none; }
  </style>
</head>
<body>

  <h1>Travel Video Matcher</h1>
  <p>Upload a travel video and we'll find matching Flight Centre packages.</p>

  <div class="upload-box">
    <input type="file" id="videoInput" accept="video/*" />
    <br/>
    <button id="submitBtn" onclick="submitVideo()">Analyse & Match</button>
  </div>

  <div id="status"></div>

  <!-- AI Analysis Result -->
  <div id="analysis">
    <h2>Video Analysis</h2>
    <pre id="analysisJson"></pre>
  </div>

  <!-- Matched Packages -->
  <div id="results"></div>
  <div id="no-match">No matching packages found for this video.</div>

  <script>
  async function submitVideo() {
    const input = document.getElementById("videoInput");
    const status = document.getElementById("status");
    const btn = document.getElementById("submitBtn");
    const analysisSection = document.getElementById("analysis");
    const analysisJson = document.getElementById("analysisJson");
    const resultsDiv = document.getElementById("results");
    const noMatch = document.getElementById("no-match");

    // Check that the user selected a video.
    if (!input.files.length) {
      alert("Please select a video file first.");
      return;
    }

    // Prepare the video for the /api/analyse endpoint.
    const formData = new FormData();
    formData.append("video", input.files[0]);

    // Reset results from any previous analysis.
    btn.disabled = true;
    analysisSection.style.display = "none";
    resultsDiv.innerHTML = "";
    noMatch.style.display = "none";

    try {
      /*
       * STEP 1: Send the video to Gemini.
       *
       * This endpoint only analyses the video.
       * It does not search the package database.
       */
      status.textContent =
        "Uploading and analysing video with Gemini AI...";

      const analyseResponse = await fetch("/api/analyse", {
        method: "POST",
        body: formData
      });

      const analyseData = await analyseResponse.json();

      // Handle the new structured backend error response.
      if (!analyseResponse.ok || !analyseData.success) {
        const message =
          analyseData.error?.message ||
          "The video could not be analysed.";

        throw new Error(message);
      }

      const analysis = analyseData.analysis;

      // Display the Gemini analysis.
      analysisSection.style.display = "block";
      analysisJson.textContent = JSON.stringify(
        analysis,
        null,
        2
      );

      /*
       * STEP 2: Send Gemini's analysis to the matching endpoint.
       *
       * This endpoint searches packages.db using the destinations
       * and travel styles found by Gemini.
       */
      status.textContent =
        "Analysis complete. Finding matching packages...";

      const matchResponse = await fetch("/api/packages/match", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          analysis: analysis
        })
      });

      const matchData = await matchResponse.json();

      if (!matchResponse.ok || !matchData.success) {
        const message =
          matchData.error?.message ||
          "Packages could not be matched.";

        throw new Error(message);
      }

      // The new matching endpoint returns its results as "packages".
      const packages = matchData.packages || [];

      status.textContent =
        `Analysis complete. ${matchData.total_matches} matching package(s) found.`;

      displayPackages(packages);

    } catch (error) {
      status.textContent = "Error: " + error.message;
    } finally {
      btn.disabled = false;
    }
  }


  /*
   * Displays the packages returned by /api/packages/match.
   *
   * Keeping this in a separate function makes the frontend easier
   * to maintain and lets the redesigned results page reuse it.
   */
  function displayPackages(packages) {
    const resultsDiv = document.getElementById("results");
    const noMatch = document.getElementById("no-match");

    resultsDiv.innerHTML = "";
    noMatch.style.display = "none";

    if (!packages.length) {
      noMatch.style.display = "block";
      return;
    }

    resultsDiv.innerHTML =
      `<h2>Matched Packages (${packages.length})</h2>`;

    packages.forEach(packageData => {
      /*
       * Some database fields may be missing.
       * These fallback values prevent the page from crashing.
       */
      const price =
        packageData.price_from_aud != null
          ? `From A$${Number(
              packageData.price_from_aud
            ).toLocaleString()}`
          : "Price unavailable";

      const duration =
        packageData.duration_nights != null
          ? `${packageData.duration_nights} nights`
          : "Duration unavailable";

      const image = packageData.image_url
        ? `
          <img
            src="${packageData.image_url}"
            alt="${packageData.name || "Travel package"}"
            style="
              width: 100%;
              max-height: 200px;
              object-fit: cover;
              border-radius: 6px;
              margin-bottom: 12px;
            "
            onerror="this.style.display='none'"
          />
        `
        : "";

      const tags = (packageData.vibe_tags || [])
        .map(tag => `<span class="tag">${tag}</span>`)
        .join("");

      const reasons = (packageData.match_reasons || [])
        .join(" · ");

      const score =
        packageData.match_score != null
          ? ` (score: ${packageData.match_score})`
          : "";

      const packageLink = packageData.url
        ? `
          <br />
          <a
            href="${packageData.url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            View Package →
          </a>
        `
        : "";

      resultsDiv.insertAdjacentHTML(
        "beforeend",
        `
          <div class="package-card">
            ${image}

            <h3>${packageData.name || "Unnamed package"}</h3>

            <div class="price">${price}</div>

            <div class="meta">
              ${packageData.destination || "Destination unavailable"}
              &nbsp;|&nbsp;
              ${duration}
              &nbsp;|&nbsp;
              ${packageData.category || "Package"}
            </div>

            <p style="font-size:14px;color:#444;">
              ${packageData.summary || "No summary available."}
            </p>

            <div>${tags}</div>

            <div class="reasons">
              <strong>Why matched:</strong>
              ${reasons || "Matching details unavailable."}
              ${score}
            </div>

            ${packageLink}
          </div>
        `
      );
    });
  }
</script>
</body>
</html>
