{#- The HTML half of the quote email.

    Email clients are not browsers. Outlook renders with Word, Gmail strips
    <style> blocks on some clients and rewrites classes, and flexbox and grid
    are unreliable almost everywhere. So this template breaks the usual rules
    of the project on purpose:

      * layout is nested <table> elements, not divs
      * every rule is an inline style attribute, no stylesheet
      * widths are fixed pixels inside a 600px shell, the safe common width
      * no external images, so nothing is blocked before the customer clicks

    Keep it that way when editing, or it will look right in the browser and
    broken in the inbox. Test in Gmail and Outlook, not just a browser tab. -#}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your travel quote</title>
</head>
<body style="margin:0; padding:0; background:#F5F5F7; -webkit-font-smoothing:antialiased;">

  {#- Preheader: the grey line the inbox shows next to the subject. Hidden in
      the message itself by the zero size and the white-on-white colour. -#}
  <div style="display:none; font-size:1px; color:#F5F5F7; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
    {{ quote.package.name }} for {{ quote.totals.travellers }} — {{ quote.money.total }} total, held until {{ quote.valid_until_display }}.
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#F5F5F7;">
    <tr>
      <td align="center" style="padding:28px 12px;">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:600px; background:#FFFFFF; border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(16,20,26,.06);">

          <!-- ══════ masthead ══════ -->
          <tr><td style="height:4px; background:#D50118; font-size:0; line-height:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:26px 32px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td align="left" style="font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:bold; letter-spacing:.08em; color:#D50118;">
                    FLIGHT CENTRE &middot; TRIP BRIDGE
                  </td>
                  <td align="right" style="font-family:Helvetica,Arial,sans-serif; font-size:11px; color:#6E6E73;">
                    Quote {{ quote.reference }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ══════ the greeting ══════ -->
          <tr>
            <td style="padding:22px 32px 0; font-family:Helvetica,Arial,sans-serif;">
              <h1 style="margin:0; font-size:24px; line-height:1.25; letter-spacing:-.5px; color:#1D1D1F;">
                Hi {{ quote.customer.name }}, here's your trip.
              </h1>
              <p style="margin:10px 0 0; font-size:14px; line-height:1.55; color:#6E6E73;">
                We built this from the video you shared in store. Everything below is held
                for you until <strong style="color:#1D1D1F;">{{ quote.valid_until_display }}</strong>.
              </p>
            </td>
          </tr>

          {%- if quote.agent_message %}
          <!-- ══════ the consultant's note ══════ -->
          <tr>
            <td style="padding:20px 32px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#F5F5F7; border-radius:10px;">
                <tr>
                  <td style="padding:14px 16px; font-family:Helvetica,Arial,sans-serif; font-size:13.5px; line-height:1.55; color:#1D1D1F; border-left:3px solid #D50118;">
                    {{ quote.agent_message }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          {%- endif %}

          <!-- ══════ the package ══════ -->
          <tr>
            <td style="padding:26px 32px 0; font-family:Helvetica,Arial,sans-serif;">
              <div style="font-size:11px; font-weight:bold; letter-spacing:.06em; color:#6E6E73; text-transform:uppercase;">Your package</div>
              <div style="margin-top:8px; font-size:18px; font-weight:bold; line-height:1.3; color:#1D1D1F;">{{ quote.package.name }}</div>
              <div style="margin-top:5px; font-size:13px; color:#6E6E73;">{{ package_meta }}</div>
              {%- if quote.package.summary %}
              <p style="margin:12px 0 0; font-size:13.5px; line-height:1.6; color:#1D1D1F;">{{ quote.package.summary }}</p>
              {%- endif %}
            </td>
          </tr>

          {%- if inclusions %}
          <!-- ══════ what's included ══════ -->
          <tr>
            <td style="padding:22px 32px 0; font-family:Helvetica,Arial,sans-serif;">
              <div style="font-size:11px; font-weight:bold; letter-spacing:.06em; color:#6E6E73; text-transform:uppercase;">What's included</div>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top:8px;">
                {%- for item in inclusions %}
                <tr>
                  <td width="16" valign="top" style="padding:4px 0 0; font-size:13.5px; color:#D50118;">&bull;</td>
                  <td style="padding:4px 0 0; font-size:13.5px; line-height:1.5; color:#1D1D1F;">{{ item }}</td>
                </tr>
                {%- endfor %}
              </table>
            </td>
          </tr>
          {%- endif %}

          <!-- ══════ the numbers ══════ -->
          <tr>
            <td style="padding:26px 32px 0; font-family:Helvetica,Arial,sans-serif;">
              <div style="font-size:11px; font-weight:bold; letter-spacing:.06em; color:#6E6E73; text-transform:uppercase;">Your quote</div>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top:10px; font-size:13.5px;">
                <tr>
                  <td style="padding:7px 0; color:#6E6E73;">Per person (twin share)</td>
                  <td align="right" style="padding:7px 0; color:#1D1D1F; font-weight:bold;">{{ quote.money.per_person }}</td>
                </tr>
                <tr>
                  <td style="padding:7px 0; color:#6E6E73;">Travellers &times; {{ quote.totals.travellers }}</td>
                  <td align="right" style="padding:7px 0; color:#1D1D1F; font-weight:bold;">{{ quote.money.subtotal }}</td>
                </tr>
                <tr>
                  <td style="padding:7px 0; color:#6E6E73;">Booking fee</td>
                  <td align="right" style="padding:7px 0; color:#1D1D1F; font-weight:bold;">{{ quote.money.booking_fee }}</td>
                </tr>
                <tr><td colspan="2" style="padding:0;"><div style="height:1px; background:#D8D8DC; margin:8px 0;"></div></td></tr>
                <tr>
                  <td style="padding:4px 0; font-size:15px; font-weight:bold; color:#1D1D1F;">Total</td>
                  <td align="right" style="padding:4px 0; font-size:22px; font-weight:bold; letter-spacing:-.5px; color:#1D1D1F;">{{ quote.money.total }}</td>
                </tr>
                <tr>
                  <td style="padding:4px 0; font-size:12.5px; color:#6E6E73;">Deposit due on acceptance (20%)</td>
                  <td align="right" style="padding:4px 0; font-size:12.5px; font-weight:bold; color:#1D1D1F;">{{ quote.money.deposit }}</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ══════ trip details ══════ -->
          <tr>
            <td style="padding:22px 32px 0; font-family:Helvetica,Arial,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#F5F5F7; border-radius:10px; font-size:13px;">
                <tr>
                  <td style="padding:12px 16px; color:#6E6E73;">Departure</td>
                  <td align="right" style="padding:12px 16px; color:#1D1D1F; font-weight:bold;">{{ quote.departure_display }}</td>
                </tr>
                <tr>
                  <td style="padding:0 16px 12px; color:#6E6E73;">Quote valid until</td>
                  <td align="right" style="padding:0 16px 12px; color:#1D1D1F; font-weight:bold;">{{ quote.valid_until_display }}</td>
                </tr>
              </table>
            </td>
          </tr>

          {%- if has_attachment %}
          <tr>
            <td style="padding:18px 32px 0; font-family:Helvetica,Arial,sans-serif; font-size:12.5px; color:#6E6E73;">
              A printable copy of this quote is attached as a PDF.
            </td>
          </tr>
          {%- endif %}

          <!-- ══════ fine print ══════ -->
          <tr>
            <td style="padding:24px 32px 30px; font-family:Helvetica,Arial,sans-serif;">
              <div style="height:1px; background:#D8D8DC; margin-bottom:14px;"></div>
              <p style="margin:0; font-size:11px; line-height:1.6; color:#6E6E73;">
                Prices are indicative, per person, twin share, in AUD, and are subject to
                availability at the time of booking. Airfares are excluded unless listed in
                the inclusions above. Reply to this email or visit your nearest store to
                confirm the booking.
              </p>
              <p style="margin:10px 0 0; font-size:11px; color:#6E6E73;">
                Trip Bridge is a Flight Centre in-store concept. Quote {{ quote.reference }}, issued {{ quote.issued_on_display }}.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
